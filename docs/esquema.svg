<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title>Esquema de ligação - Sensor de umidade do solo com Arduino Uno</title>
  <rect width="760" height="490" fill="#ffffff"/>

  <g stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barramento GND -->
    <path d="M700 70 V445"/>
    <path d="M180 445 H700"/>

    <!-- LEDs: D2, D3, D4 -->
    <path d="M180 90 H260 M320 90 H400 M430 90 H700"/>
    <path d="M180 150 H260 M320 150 H400 M430 150 H700"/>
    <path d="M180 210 H260 M320 210 H400 M430 210 H700"/>

    <!-- Sensor: A0 -> haste 2 e resistor 10k -->
    <path d="M180 280 H600 V300 M600 360 V445"/>
    <path d="M530 280 V415"/>
    <!-- D7 -> haste 1 -->
    <path d="M180 340 H450 V415"/>
  </g>

  <!-- Resistores 220 -->
  <g fill="#fef3c7" stroke="#1f2937" stroke-width="2">
    <rect x="260" y="80" width="60" height="20" rx="4"/>
    <rect x="260" y="140" width="60" height="20" rx="4"/>
    <rect x="260" y="200" width="60" height="20" rx="4"/>
    <rect x="590" y="300" width="20" height="60" rx="4"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="290" y="72">220 Ω</text>
    <text x="290" y="132">220 Ω</text>
    <text x="290" y="192">220 Ω</text>
    <text x="640" y="334">10 kΩ</text>
  </g>

  <!-- LEDs (triângulo + barra) -->
  <g stroke="#1f2937" stroke-width="2" stroke-linejoin="round">
    <path d="M400 78 L426 90 L400 102 Z" fill="#22c55e"/>
    <path d="M428 78 V102"/>
    <path d="M400 138 L426 150 L400 162 Z" fill="#facc15"/>
    <path d="M428 138 V162"/>
    <path d="M400 198 L426 210 L400 222 Z" fill="#ef4444"/>
    <path d="M428 198 V222"/>
  </g>
  <g font-size="13" fill="#111827">
    <text x="445" y="80">LED verde · úmido</text>
    <text x="445" y="140">LED amarelo · atenção</text>
    <text x="445" y="200">LED vermelho · seco (pisca)</text>
  </g>
  <g font-size="11" fill="#6b7280">
    <text x="384" y="78" text-anchor="end">+</text>
    <text x="442" y="104">−</text>
  </g>

  <!-- Vaso com terra -->
  <path d="M405 360 H575 L560 430 H420 Z" fill="#a16207" fill-opacity="0.25" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
  <text x="490" y="424" font-size="12" fill="#78350f" text-anchor="middle">terra</text>
  <!-- Hastes -->
  <g stroke="#6b7280" stroke-width="5" stroke-linecap="round">
    <path d="M450 372 V412"/>
    <path d="M530 372 V412"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="440" y="332" text-anchor="end">haste 1</text>
    <text x="538" y="300">haste 2</text>
  </g>

  <!-- Junções -->
  <g fill="#1f2937">
    <circle cx="530" cy="280" r="4"/>
    <circle cx="700" cy="90" r="4"/>
    <circle cx="700" cy="150" r="4"/>
    <circle cx="700" cy="210" r="4"/>
    <circle cx="600" cy="445" r="4"/>
  </g>
  <text x="708" y="64" font-size="13" font-weight="600" fill="#111827">GND</text>

  <!-- Arduino -->
  <rect x="30" y="40" width="150" height="425" rx="10" fill="#0e7490"/>
  <text x="105" y="70" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Arduino Uno</text>
  <g font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">
    <text x="170" y="95">D2</text>
    <text x="170" y="155">D3</text>
    <text x="170" y="215">D4</text>
    <text x="170" y="285">A0</text>
    <text x="170" y="345">D7</text>
    <text x="170" y="450">GND</text>
  </g>
  <g fill="#ffffff" stroke="#1f2937" stroke-width="1.5">
    <circle cx="180" cy="90" r="4"/>
    <circle cx="180" cy="150" r="4"/>
    <circle cx="180" cy="210" r="4"/>
    <circle cx="180" cy="280" r="4"/>
    <circle cx="180" cy="340" r="4"/>
    <circle cx="180" cy="445" r="4"/>
  </g>
  <g font-size="11" fill="#e0f2fe">
    <text x="42" y="300">leitura analógica</text>
    <text x="42" y="360">liga o sensor só</text>
    <text x="42" y="374">durante a leitura</text>
  </g>
</svg>
